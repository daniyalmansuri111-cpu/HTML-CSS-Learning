name: Deploy All Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Noir-Fragrance
        working-directory: Noir-Fragrance
        run: |
          npm ci
          npm run build

      - name: Build JobTrack
        working-directory: job-application-tracker
        run: |
          npm ci
          npm run build

      - name: Build CosmoExplorer
        working-directory: CosmoExplorer
        run: |
          npm ci
          npm run build

      - name: Build Smart Quiz
        working-directory: Smart Quiz App
        run: |
          npm ci
          npm run build

      - name: Prepare GitHub Pages
        run: |
          set -e
          mkdir -p pages

          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='Noir-Fragrance' \
            --exclude='job-application-tracker' \
            --exclude='CosmoExplorer' \
            --exclude='Smart Quiz App' \
            --exclude='pages' \
            ./ pages/

          mkdir -p pages/Noir-Fragrance
          cp -r Noir-Fragrance/dist/. pages/Noir-Fragrance/

          mkdir -p pages/job-application-tracker
          cp -r job-application-tracker/dist/. pages/job-application-tracker/

          mkdir -p pages/CosmoExplorer
          cp -r CosmoExplorer/dist/. pages/CosmoExplorer/

          mkdir -p pages/Smart-Quiz-App
          cp -r 'Smart Quiz App/dist/.' pages/Smart-Quiz-App/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
