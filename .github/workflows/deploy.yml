name: Deploy All Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Smart Quiz
        working-directory: Smart Quiz App
        run: |
          npm install
          npm run build

      - name: Build CosmoExplorer
        working-directory: CosmoExplorer
        run: |
          npm install
          npm run build

      - name: Build Noir-Fragrance
        working-directory: Noir-Fragrance
        run: |
          npm install
          npm run build

      - name: Build Job Application Tracker
        working-directory: job-application-tracker
        run: |
          npm install
          npm run build

      - name: Prepare GitHub Pages
        run: |
          set -e
          rm -rf pages
          mkdir -p pages

          # Copy repository content first so README/source folders remain available.
          for item in *; do
            case "$item" in
              pages|"Smart Quiz App"|CosmoExplorer|Noir-Fragrance|job-application-tracker|node_modules) continue ;;
            esac
            cp -r "$item" pages/
          done

          # Deploy production builds at their project paths.
          mkdir -p "pages/Smart Quiz App"
          cp -r "Smart Quiz App/dist/." "pages/Smart Quiz App/"

          mkdir -p pages/Smart-Quiz-App
          cp -r "Smart Quiz App/dist/." pages/Smart-Quiz-App/

          mkdir -p pages/CosmoExplorer
          cp -r CosmoExplorer/dist/. pages/CosmoExplorer/

          mkdir -p pages/Noir-Fragrance
          cp -r Noir-Fragrance/dist/. pages/Noir-Fragrance/

          mkdir -p pages/job-application-tracker
          cp -r job-application-tracker/dist/. pages/job-application-tracker/

          # Prevent Jekyll from changing static project structure.
          touch pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
