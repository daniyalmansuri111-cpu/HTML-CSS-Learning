name: Deploy All Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Smart Quiz
        working-directory: Smart Quiz App
        run: |
          npm install
          npm run build

      - name: Prepare GitHub Pages
        run: |
          set -e
          rm -rf pages
          mkdir -p pages

          # Copy all static projects and files so their existing folder URLs
          # continue to work on GitHub Pages.
          for item in *; do
            case "$item" in
              pages|"Smart Quiz App"|node_modules) continue ;;
            esac
            cp -r "$item" pages/
          done

          # Deploy the production build for Smart Quiz at both the original
          # folder name and the clean URL used in the README.
          mkdir -p "pages/Smart Quiz App"
          cp -r "Smart Quiz App/dist/." "pages/Smart Quiz App/"

          mkdir -p pages/Smart-Quiz-App
          cp -r "Smart Quiz App/dist/." pages/Smart-Quiz-App/

          # Prevent Jekyll from changing the structure of static projects.
          touch pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
