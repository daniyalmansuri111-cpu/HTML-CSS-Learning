<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Calculator</title>
  <style>
    body {
      background-color: #dcd6f7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      width: 260px;
    }
    #display {
      width: 100%;
      height: 50px;
      font-size: 24px;
      text-align: right;
      margin-bottom: 10px;
      border: 2px solid #a594f9;
      border-radius: 8px;
      padding: 5px 10px;
      box-sizing: border-box;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 50px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #e5deff;
      color: #333;
    }
    button:hover {
      background-color: #c9bcfa;
    }
    .operator {
      background-color: #a594f9;
      color: white;
    }
    .equals {
      background-color: #6c4fd9;
      color: white;
      grid-column: span 2;
    }
    .clear {
      background-color: #f18c8c;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="pressButton('/')">÷</button>
      <button class="operator" onclick="pressButton('*')">×</button>
      <button onclick="pressButton('7')">7</button>
      <button onclick="pressButton('8')">8</button>
      <button onclick="pressButton('9')">9</button>
      <button class="operator" onclick="pressButton('-')">−</button>
      <button onclick="pressButton('4')">4</button>
      <button onclick="pressButton('5')">5</button>
      <button onclick="pressButton('6')">6</button>
      <button class="operator" onclick="pressButton('+')">+</button>
      <button onclick="pressButton('1')">1</button>
      <button onclick="pressButton('2')">2</button>
      <button onclick="pressButton('3')">3</button>
      <button onclick="pressButton('.')">.</button>
      <button onclick="pressButton('0')">0</button>
      <button class="equals" onclick="calculateResult()">=</button>
    </div>
  </div>
  <script>
    var display = document.getElementById('display');
    function pressButton(value) {
      display.value = display.value + value;
    }
    function clearDisplay() {
      display.value = '';
    }
    function calculateResult() {
      try {
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
